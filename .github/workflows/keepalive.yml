name: keepalive

# Pings the app daily so Supabase (free tier) doesn't pause after 7 days of
# inactivity, and Railway (serverless) gets woken. /api/keepalive touches the
# Supabase REST API, which is what actually resets Supabase's inactivity timer.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no repo commits,
# and scheduled runs can be delayed under load. Keep a free external uptime
# monitor (e.g. cron-job.org / UptimeRobot) pointed at the same URL as a backup.

on:
  schedule:
    - cron: '17 6 * * *'   # daily ~06:17 UTC (odd minute to avoid the top-of-hour rush)
  workflow_dispatch: {}     # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive + AI health
        # ai=1 also runs a 1-token Anthropic call server-side. A red run here
        # (→ GitHub failure email) means either the site/db is down or the
        # Anthropic credit balance is exhausted ("ai":"credit_low").
        run: |
          for i in 1 2 3; do
            body=$(curl -s --max-time 60 "https://www.aiwillmake.com/api/keepalive?ai=1") || body=""
            echo "attempt $i: $body"
            if echo "$body" | grep -q '"db":"ok"' && echo "$body" | grep -q '"ai":"ok"'; then
              echo "keepalive + AI health ok"; exit 0
            fi
            sleep 20
          done
          echo "keepalive/AI health failed after 3 attempts (db not ok or AI credits low)"; exit 1
